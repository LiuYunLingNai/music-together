name: Android CI

on:
  push:
    paths:
      - "packages/android-client/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "packages/android-client/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      variant:
        description: "选择需要构建的 Android 版本"
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: "Publish or update the GitHub Release (release builds only)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_info:
    name: Detect Android version change
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.variant == 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
      should_publish: ${{ steps.version.outputs.should_publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version change
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          version_file="packages/android-client/app/build.gradle.kts"
          current_version="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$version_file" | head -n 1)"

          if [ -z "$current_version" ]; then
            echo "::error::Unable to read versionName from $version_file"
            exit 1
          fi

          should_build=false
          should_publish=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_build=true
            should_publish="${PUBLISH_RELEASE:-false}"
          else
            previous_version=""
            if [ -n "${BEFORE_SHA:-}" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
              previous_version="$(git show "$BEFORE_SHA:$version_file" 2>/dev/null | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' | head -n 1 || true)"
            fi

            if [ "$current_version" != "$previous_version" ]; then
              should_build=true
              should_publish=true
            fi

            echo "Android version: ${previous_version:-none} -> $current_version"
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

  debug:
    name: Debug test build
    if: github.event_name != 'workflow_dispatch' || inputs.variant == 'debug'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/android-client

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Check and build Debug APKs
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testStandardDebugUnitTest lintStandardDebug assembleStandardDebug assembleVivoDebug

      - name: Create Debug checksums
        run: |
          cd app/build/outputs/apk
          sha256sum standard/debug/app-standard-debug.apk > app-standard-debug.apk.sha256
          sha256sum vivo/debug/app-vivo-debug.apk > app-vivo-debug.apk.sha256

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: music-together-android-debug-${{ github.run_number }}
          path: |
            packages/android-client/app/build/outputs/apk/standard/debug/app-standard-debug.apk
            packages/android-client/app/build/outputs/apk/standard/debug/app-standard-debug.apk.sha256
            packages/android-client/app/build/outputs/apk/vivo/debug/app-vivo-debug.apk
            packages/android-client/app/build/outputs/apk/vivo/debug/app-vivo-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Signed Release build
    needs: release_info
    if: needs.release_info.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: packages/android-client

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 37.0
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing Actions secret: ${secret_name}"
              exit 1
            fi
          done

          mkdir -p keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > keystore/music-together-release.jks
          {
            printf 'storeFile=keystore/music-together-release.jks\n'
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > keystore.properties

      - name: Build signed Release APKs and AAB
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleStandardRelease assembleVivoRelease bundleStandardRelease

      - name: Verify Release APK signatures
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/standard/release/app-standard-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/vivo/release/app-vivo-release.apk

      - name: Prepare named Release files and checksums
        env:
          VERSION: ${{ needs.release_info.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/standard/release/app-standard-release.apk "dist/music-together-v${VERSION}.apk"
          cp app/build/outputs/apk/vivo/release/app-vivo-release.apk "dist/music-together-vivo-${VERSION}.apk"
          cp app/build/outputs/bundle/standardRelease/app-standard-release.aab "dist/music-together-v${VERSION}.aab"
          cd dist
          sha256sum "music-together-v${VERSION}.apk" > "music-together-v${VERSION}.apk.sha256"
          sha256sum "music-together-vivo-${VERSION}.apk" > "music-together-vivo-${VERSION}.apk.sha256"
          sha256sum "music-together-v${VERSION}.aab" > "music-together-v${VERSION}.aab.sha256"

      - name: Upload signed Release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: music-together-android-release-v${{ needs.release_info.outputs.version }}
          path: packages/android-client/dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: needs.release_info.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_info.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          previous_tag="$(
            git describe \
              --tags \
              --abbrev=0 \
              --match 'v[0-9]*' \
              --exclude="$tag" \
              "$GITHUB_SHA" 2>/dev/null || true
          )"
          notes_file="$RUNNER_TEMP/android-release-notes.md"
          release_notes="$GITHUB_WORKSPACE/docs/releases/${VERSION}.md"

          if [ -f "$release_notes" ]; then
            cp "$release_notes" "$notes_file"
          else
            {
              printf '## Full Changelog\n\n'
              if [ -n "$previous_tag" ]; then
                git log \
                  --no-merges \
                  --format='- %s (`%h`)' \
                  "$previous_tag..$GITHUB_SHA"
                printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' \
                  "$GITHUB_REPOSITORY" "$previous_tag" "$tag"
              else
                git log \
                  --no-merges \
                  --format='- %s (`%h`)' \
                  "$GITHUB_SHA"
              fi
            } > "$notes_file"
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for stale_asset in \
              "music-together-v${VERSION}.zip" \
              "music-together-v${VERSION}.zip.sha256" \
              "music-together-vivo-${VERSION}.zip" \
              "music-together-vivo-${VERSION}.zip.sha256" \
              "music-together-vivo-${VERSION}.apk" \
              "music-together-vivo-${VERSION}.apk.sha256"; do
              gh release delete-asset "$tag" "$stale_asset" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
            done
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Music Together Android v${VERSION}" \
              --notes-file "$notes_file"
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Music Together Android v${VERSION}" \
              --notes-file "$notes_file"
          fi

      - name: Remove signing material
        if: always()
        run: |
          rm -f keystore.properties
          rm -f keystore/music-together-release.jks
