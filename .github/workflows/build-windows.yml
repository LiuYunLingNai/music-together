name: Windows CI

on:
  push:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'electron/**'
      - 'src/**'
      - 'scripts/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      variant:
        description: '选择需要构建的 Windows 版本'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release
      publish_release:
        description: '发布或更新 GitHub Release（仅正式构建）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_info:
    name: Detect Windows version change
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.variant == 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build: ${{ steps.version.outputs.should_build }}
      should_publish: ${{ steps.version.outputs.should_publish }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Detect version change
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(node -p "require('./package.json').version")"
          should_build=false
          should_publish=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_build=true
            should_publish="${PUBLISH_RELEASE:-false}"
          else
            previous_version=""
            if [ -n "${BEFORE_SHA:-}" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
              previous_version="$(git show "$BEFORE_SHA:package.json" 2>/dev/null | node -e 'let input=""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { try { process.stdout.write(JSON.parse(input).version || "") } catch {} })' || true)"
            fi
            if [ "$current_version" != "$previous_version" ]; then
              should_build=true
              should_publish=true
            fi
            echo "Windows version: ${previous_version:-none} -> $current_version"
          fi

          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"

  debug:
    name: Debug test build
    if: github.event_name != 'workflow_dispatch' || inputs.variant == 'debug'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows debug packages
        run: npm run dist:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create debug package checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Upload debug packages
        uses: actions/upload-artifact@v4
        with:
          name: music-together-windows-debug-${{ github.run_number }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: Release build
    needs: release_info
    if: needs.release_info.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows release packages
        run: npm run dist:win:release -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Create release package checksums
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap' } | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }

      - name: Upload release packages
        uses: actions/upload-artifact@v4
        with:
          name: music-together-windows-release-v${{ needs.release_info.outputs.version }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release
        if: needs.release_info.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release_info.outputs.version }}
        run: |
          set -euo pipefail
          tag="windows-v${VERSION}"
          notes_file=".github/changelogs/windows-v${VERSION}.md"
          shopt -s nullglob
          assets=(release/*.exe release/*.blockmap release/*.sha256)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No Windows release assets found"
            exit 1
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ -f "$notes_file" ]; then
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Music Together Windows v${VERSION}" \
                --notes-file "$notes_file"
            else
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Music Together Windows v${VERSION}"
            fi
            gh release upload "$tag" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            if [ -f "$notes_file" ]; then
              gh release create "$tag" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Music Together Windows v${VERSION}" \
                --notes-file "$notes_file"
            else
              gh release create "$tag" "${assets[@]}" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "Music Together Windows v${VERSION}" \
                --generate-notes
            fi
          fi
