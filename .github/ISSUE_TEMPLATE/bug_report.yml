name: Bug 报告
description: 报告可以稳定复现的问题
title: '[Bug] '
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 请说明实际表现和预期表现。
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: 客户端
      options:
        - Web
        - Android
        - Windows
        - 服务端
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 请提供部署版本、浏览器或系统版本；不要粘贴 Cookie、密钥和数据库内容。
    validations:
      required: true
