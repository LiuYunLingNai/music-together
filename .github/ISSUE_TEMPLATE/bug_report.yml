name: Bug report
description: Report a reproducible Music Together problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Create or join a room
        2. ...
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Local development
        - Docker / GHCR image
        - Reverse proxy / NAS
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove cookies, tokens, passwords, room secrets, and personal data before submitting.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Sensitive data check
      options:
        - label: I removed all cookies, tokens, passwords, and platform credentials.
          required: true
