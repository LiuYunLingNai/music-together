<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{track.title}}</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1240px;
        color: #f8f9ff;
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #14151c;
      }
      .card {
        position: relative;
        display: flex;
        min-height: 700px;
        padding: 72px;
        gap: 56px;
        align-items: center;
        overflow: hidden;
        background: #14151c;
      }
      .backdrop {
        position: absolute;
        inset: -28px;
        background-position: center;
        background-size: cover;
        filter: blur(28px);
        opacity: 0.42;
        transform: scale(1.08);
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          110deg,
          rgba(14, 15, 23, 0.72),
          rgba(20, 21, 28, 0.78) 52%,
          rgba(20, 21, 28, 0.96)
        );
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 20% 44%, rgba(128, 104, 184, 0.55), transparent 48%),
          radial-gradient(circle at 88% 8%, rgba(71, 145, 148, 0.4), transparent 42%);
      }
      .content {
        position: relative;
        z-index: 1;
        display: flex;
        width: 100%;
        align-items: center;
      }
      .cover-wrap {
        position: relative;
        flex: 0 0 380px;
        width: 380px;
        height: 380px;
      }
      .cover-shadow {
        position: absolute;
        inset: 18px -2px -18px 12px;
        border-radius: 34px;
        background: rgba(0, 0, 0, 0.42);
        filter: blur(16px);
      }
      .cover {
        position: relative;
        width: 380px;
        height: 380px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 34px;
        object-fit: cover;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.32);
        background: linear-gradient(135deg, #7987dc, #32b5ac);
      }
      .info {
        min-width: 0;
        flex: 1;
        padding-right: 12px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 23px;
        letter-spacing: 2px;
      }
      .brand-mark {
        display: inline-flex;
        width: 48px;
        height: 48px;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.28);
        border-radius: 50%;
        color: #b7fff5;
        font-size: 25px;
      }
      .room {
        display: inline-block;
        max-width: 650px;
        margin-top: 26px;
        padding: 9px 20px;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(255, 255, 255, 0.22);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.1);
        font-size: 22px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      h1 {
        max-width: 700px;
        margin: 24px 0 18px;
        overflow: hidden;
        font-size: 58px;
        line-height: 1.18;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .subtitle {
        max-width: 700px;
        overflow: hidden;
        color: rgba(255, 255, 255, 0.88);
        font-size: 32px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
        color: rgba(255, 255, 255, 0.72);
        font-size: 23px;
      }
      .meta span {
        padding: 7px 16px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.08);
      }
      .footer {
        position: absolute;
        right: 72px;
        bottom: 60px;
        z-index: 1;
        color: rgba(255, 255, 255, 0.6);
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      {{if track.cover}}
      <div class="backdrop" style="background-image:url('{{track.cover}}')"></div>
      {{/if}}
      <div class="scrim"></div>
      <div class="glow"></div>
      <div class="content">
        <div class="cover-wrap">
          <div class="cover-shadow"></div>
          {{if track.cover}}<img class="cover" src="{{track.cover}}" />{{else}}
          <div class="cover"></div>
          {{/if}}
        </div>
        <section class="info">
          <div class="brand">
            <span class="brand-mark">♪</span><span>Music Together · 一起听歌</span>
          </div>
          <div class="room">▶ 正在播放 · {{track.roomName}}</div>
          <h1>{{track.title}}</h1>
          <div class="subtitle">{{track.artist}}{{if track.album}} · {{track.album}}{{/if}}</div>
          <div class="meta">
            {{if track.duration}}<span>时长 {{track.duration}}</span>{{/if}}<span
              >{{track.source}}</span
            ><span>{{track.listenerText}}</span>
          </div>
        </section>
      </div>
      <div class="footer">实时同步播放</div>
    </main>
  </body>
</html>
